name: Build Webmin theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build theme package
        run: bash build.sh

      - name: Verify package contents
        run: |
          tar -tzf dist/memocraft-theme.wbt.gz > dist/workflow-package-files.txt
          head -40 dist/workflow-package-files.txt
          grep -Fxq 'memocraft-theme/theme.info' dist/workflow-package-files.txt
          grep -Fxq 'memocraft-theme/theme.pl' dist/workflow-package-files.txt
          grep -Fxq 'memocraft-theme/index.cgi' dist/workflow-package-files.txt

      - name: Upload Webmin theme package
        uses: actions/upload-artifact@v4
        with:
          name: memocraft-theme
          path: dist/memocraft-theme.wbt.gz
          if-no-files-found: error
